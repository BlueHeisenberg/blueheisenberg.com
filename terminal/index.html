(function () {
  var t;
  try { t = localStorage.getItem('cv-theme'); } catch (e) { /* storage blocked: start green */ }

<style>
@font-face{font-family:VT323;font-weight:400;font-display:block;src:url(fonts/vt323-400.woff2) format("woff2")}

/* VT323 has a 0.4em advance, so 1ch = .4em and sizes in steps of 5px stay on its pixel grid. */
:root{
  color-scheme:dark;--bg:#020b05;--fg:#3dff7c;--hi:#c9ffd9;--dim:#26b95c;--key:#001a08;--case:#111411;
  --glow:0 0 2px rgba(61,255,124,.6),0 0 11px rgba(61,255,124,.3);
  --glow2:0 0 3px rgba(61,255,124,.9),0 0 16px rgba(61,255,124,.45);
  --fs:20px;--pad:16px;--bez:4px;--r:14px;
}
@media (min-width:700px){:root{--fs:25px;--pad:24px;--bez:10px;--r:24px}}
@media (min-width:1200px) and (min-height:700px){:root{--fs:30px;--pad:36px;--bez:16px;--r:38px}}
@media (min-width:1800px) and (min-height:1000px){:root{--fs:40px}}
/* Light is a printed teletype: greenbar tractor-feed paper, ribbon ink, no tube. */
:root[data-theme=light]{
  color-scheme:light;--bg:#f7f2e4;--fg:#2a2822;--hi:#0c0b08;--dim:#5a5546;--key:#f7f2e4;--case:#cfc7b3;--r:0px;
  --glow:0 0 .7px rgba(42,40,34,.6);--glow2:0 0 1px rgba(42,40,34,.7);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--case)}
a{color:inherit}

#crt{position:fixed;inset:calc(var(--vt,0px) + var(--bez)) var(--bez) auto;height:calc(var(--vh,100%) - 2*var(--bez));overflow:hidden;border-radius:var(--r)/calc(var(--r)*1.15);background:var(--bg);color:var(--fg);
  font:400 var(--fs)/1.15 VT323,"Courier New",monospace;font-variant-ligatures:none;
  text-shadow:var(--glow)}
/* scanlines */
#crt::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
/* curved glass: vignette, dark edge, soft centre bloom, one reflection */
#crt::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit;
  background:linear-gradient(112deg,rgba(255,255,255,.04),transparent 26%),
    radial-gradient(90% 85% at 50% 50%,rgba(61,255,124,.05),transparent 62%,rgba(0,0,0,.5) 100%);
  box-shadow:inset 0 0 60px 14px rgba(0,0,0,.72),inset 0 0 6px 2px #000;
  animation:flicker 7s steps(1) infinite}
@keyframes flicker{0%,100%{opacity:1}41%{opacity:.93}42%{opacity:1}73%{opacity:.96}74%{opacity:1}75%{opacity:.92}76%{opacity:1}}
#roll{position:absolute;left:0;right:0;top:-20%;height:20%;z-index:4;pointer-events:none;
  background:linear-gradient(transparent,rgba(61,255,124,.035),transparent);animation:roll 9s linear infinite}
@keyframes roll{to{top:110%}}

[data-theme=light] #crt::before,[data-theme=light] #roll{display:none}
[data-theme=light] #crt::after{background:linear-gradient(transparent 88%,rgba(60,50,30,.09));box-shadow:inset 0 0 28px rgba(60,50,30,.16);animation:none}
[data-theme=light] #tube.on{animation:none}
[data-theme=light] #scr{background:
  radial-gradient(circle,var(--case) 4px,transparent 4.6px) 0 0/var(--pad) 1.5em repeat-y local,
  radial-gradient(circle,var(--case) 4px,transparent 4.6px) 100% 0/var(--pad) 1.5em repeat-y local,
  linear-gradient(#e4eeda 50%,transparent 50%) 50% 0/calc(100% - 2*var(--pad)) 6.9em repeat-y local}

#tube{position:absolute;inset:0;display:flex;flex-direction:column}
#tube.on{animation:power .5s ease-out}
@keyframes power{0%{transform:scale(1,.004);filter:brightness(9)}45%{transform:scale(1,.004);filter:brightness(9)}100%{transform:none;filter:none}}

#scr{position:relative;flex:1;min-height:0;overflow:hidden auto;padding:var(--pad) var(--pad) 0;
  scrollbar-width:thin;scrollbar-color:var(--dim) transparent;overscroll-behavior:contain}
#out{container-type:inline-size}
#out div{min-height:1.15em;white-space:pre-wrap;overflow-wrap:anywhere}
.art{white-space:pre;overflow:hidden}
.o{padding-bottom:.5em}
.echo{padding-top:.25em}
.echo,.hi,b{color:var(--hi);font-weight:400}
.dim{color:var(--dim)}
#out div.li{padding-left:2ch;text-indent:-2ch}
#out div.hang{padding-left:6ch;text-indent:-6ch}
#out .ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(19ch,1fr))}
#out .ls>span{min-width:0}
.banner{font-size:min(var(--fs),calc(100cqw/(var(--n)*.4)));line-height:.62;color:var(--hi);padding-bottom:.6em;
  text-shadow:var(--glow2)}

#out a{color:var(--hi);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em;cursor:pointer}
#out a:hover{background:var(--fg);color:var(--bg);text-shadow:none}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
::selection{background:var(--fg);color:var(--bg);text-shadow:none}

#prompt{position:sticky;bottom:0;z-index:2;display:flex;gap:1ch;padding:.1em 0 .4em;background:var(--bg);box-shadow:0 -.3em .4em var(--bg);white-space:pre-wrap}
#prompt[hidden]{display:none}
#ps1{flex:none;color:var(--hi)}
#line{position:relative;flex:1;min-width:0;overflow-wrap:anywhere;cursor:text}
#line input{position:absolute;inset:0;width:100%;opacity:0;font:inherit;border:0;background:none;color:inherit;outline:0}
.cur{display:inline-block;min-width:1ch;background:var(--fg);color:var(--bg);text-shadow:none;animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{background:none;color:inherit}}
.cur.run{animation:none}
#line:not(:focus-within) .cur{background:none;color:inherit;box-shadow:inset 0 0 0 1px var(--fg);animation:none}

#bar{flex:none;display:flex;flex-wrap:wrap;gap:3px;padding:3px var(--pad) max(6px,env(safe-area-inset-bottom));background:var(--bg)}
#bar a{flex:1;min-height:1.6em;display:flex;align-items:center;justify-content:center;padding:0 .25ch;background:var(--dim);color:var(--key);
  text-decoration:none;text-shadow:none}
#bar a:hover{background:var(--fg)}
#bar:not(.up){visibility:hidden}
@media (pointer:coarse){#bar a{min-height:44px}}

#rain{position:absolute;inset:0;z-index:3;width:100%;height:100%;background:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

@media (prefers-reduced-motion:reduce){#crt::after,#roll,#tube.on,.cur{animation:none}}
</style>

  ];

  // 5x7 bitmap font, one number per row. The first row of É is the accent.
  var GLYPHS = { B: [30, 17, 17, 30, 17, 17, 30], L: [16, 16, 16, 16, 16, 16, 31], U: [17, 17, 17, 17, 17, 17, 14], S: [15, 16, 16, 14, 1, 1, 30], N: [17, 25, 21, 19, 17, 17, 17], G: [14, 17, 16, 23, 17, 17, 15], D: [30, 17, 17, 17, 17, 17, 30], A: [14, 17, 17, 31, 17, 17, 17], V: [17, 17, 17, 17, 17, 10, 4], I: [14, 4, 4, 4, 4, 4, 14],
    P: [30, 17, 17, 30, 16, 16, 16], E: [31, 16, 16, 30, 16, 16, 31], 'É': [31, 16, 16, 30, 16, 16, 31], R: [30, 17, 17, 30, 20, 18, 17], Z: [31, 1, 2, 4, 8, 16, 31],
    C: [15, 16, 16, 16, 16, 16, 15], M: [17, 27, 21, 21, 17, 17, 17], H: [17, 17, 17, 31, 17, 17, 17], O: [14, 17, 17, 17, 17, 17, 14], ' ': [0, 0, 0, 0, 0, 0, 0] };

  // @ is a wheel hub; it spins while the bike moves.
  var BIKE = [
    '                  ___,',
    '                 _ \\\\',
    '      _________ / \\ \\\\ ____',
    ' ____/ S T A R K \\_\\ \\\\VARG\\',
    ' \\___        ________\\\\___/',
    '    .-"""-. \\_[==]_______\\\\.-"""-.',
    '   /       \\  [==]/      /\\\\      \\',
    '  |    @====|===\\/       |   \\@    |',
    '   \\       /              \\       /',
    '    \'-...-\'                \'-...-\''
  ];

  var $ = function (id) { return document.getElementById(id); };
  var crt = $('crt'), tube = $('tube'), scr = $('scr'), out = $('out'), prompt = $('prompt'), input = $('in'), bar = $('bar'), live = $('live');
  var calm = matchMedia('(prefers-reduced-motion:reduce)').matches;

  var TAP = coarse ? 'Tap' : 'Click';

    github: 'contact', linkedin: 'contact', less: 'cat', more: 'cat', open: 'cat', dir: 'ls', ll: 'ls', cls: 'clear', logout: 'reboot', exit: 'reboot' };

  var cwd = '~', hist = [], histAt = 0, anchor = null, instant = false, hashed = false;
  var busy = true, skipped = false, raining = false, chain = Promise.resolve(), wakers = [];

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  function banner(text) {
    var row = function (r) { return text.split('').map(function (ch) {
      var bits = r < 0 ? (ch === 'É' ? 2 : 0) : GLYPHS[ch][r];

  /* Timing. Everything slow goes through wait(), so one skip ends boot, typing and animations alike. */
  function wait(ms) {

    var copy = el.cloneNode(true);

    live.textContent = [].map.call(copy.children, function (n) { return n.textContent; }).join('\n');

  async function type(el) {
    var walk = document.createTreeWalker(el, 4), nodes = [], total = 0;
    while (walk.nextNode()) { nodes.push(walk.currentNode); total += walk.currentNode.data.length; }
    var texts = nodes.map(function (n) { return n.data; });

  function job(j) {

  });

  // iOS ignores interactive-widget and keeps the page full height under the keyboard, so fit the screen to the visible part.
  var vv = window.visualViewport;
  function fit() {
    if (vv.scale > 1.01) return;  // pinch zoom, not the keyboard
    crt.style.setProperty('--vh', vv.height + 'px');
    crt.style.setProperty('--vt', vv.offsetTop + 'px');
  }
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit(); }

  paintBar();

  (async function () {
    var m = location.hash.match(/^#cmd=(.+)$/), start = null;
    try { start = m && decodeURIComponent(m[1]); } catch (err) { start = null; }
    try { await document.fonts.load('20px VT323'); } catch (err) { /* the fallback font still works */ }
    skipped = calm || !!start;
    await boot();
    settle();
    if (start) {
      instant = hashed = true;
      await exec(start);
      instant = hashed = false;
    }
  })();
})();
</script>
</body>
</html>
